<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Shiye · Private Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  <link rel="alternate" hreflang="en" href="https://www.kira-malaysia.com/projects/shiye-notes/" />
<link rel="alternate" hreflang="zh-Hans" href="https://www.kira-malaysia.com/zh/projects/shiye-notes/" />
<link rel="alternate" hreflang="x-default" href="https://www.kira-malaysia.com/projects/shiye-notes/" />
</head>
  <body>
    <a class="portfolio-back" href="../../" aria-label="Back to portfolio">← Back to portfolio</a>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Notes list">
        <header class="brand-row">
          <div>
            <p class="eyebrow">SHIYE NOTES</p>
            <h1>拾页<span class="brand-dot">。</span></h1>
          </div>
          <button class="icon-button mobile-close" id="closeSidebar" aria-label="Close notes list">×</button>
        </header>

        <button class="new-note-button" id="newNoteButton" type="button">
          <span aria-hidden="true">＋</span>
          New note
          <kbd>N</kbd>
        </button>

        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" /></svg>
          <input id="searchInput" type="search" placeholder="Search your notes..." autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="list-heading">
          <span>All notes</span>
          <span id="noteCount">0 notes</span>
        </div>
        <div class="notes-list" id="notesList" role="list"></div>

        <footer class="sidebar-footer">
          <span><i class="status-light"></i> Saved on this device</span>
          <button class="text-button" id="clearAllButton" type="button">Clear</button>
        </footer>
      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <section class="editor-pane" aria-label="Notes editor">
        <header class="editor-toolbar">
          <button class="icon-button menu-button" id="openSidebar" aria-label="Open notes list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="crumb">
            <span>My notes</span>
            <span>/</span>
            <strong id="crumbTitle">Untitled note</strong>
          </div>
          <div class="toolbar-actions">
            <span class="save-state" id="saveState">Saved</span>
            <button class="icon-button" id="pinButton" aria-label="Pin note" title="Pin note">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9 3v5l-3 4v2h12v-2l-3-4V3M12 14v7" /></svg>
            </button>
            <button class="icon-button danger" id="deleteButton" aria-label="Delete note" title="Delete note">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" /></svg>
            </button>
          </div>
        </header>

        <div class="paper" id="editorArea">
          <div class="paper-meta">
            <span id="updatedAt">Today</span>
            <span class="meta-rule"></span>
            <span id="readingTime">Less than 1 min read</span>
          </div>
          <input class="title-input" id="titleInput" aria-label="Note title" placeholder="Untitled note" maxlength="120" />
          <textarea class="content-input" id="contentInput" aria-label="Note content" placeholder="Start writing here..."></textarea>
        </div>

        <footer class="editor-footer">
          <div class="writing-hint"><span>✦</span> Ideas do not need to be complete. Write them down first.</div>
          <div><span id="wordCount">0 words</span><span class="separator">·</span><span id="charCount">0 characters</span></div>
        </footer>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-mark">页</div>
          <h2>No notes yet</h2>
          <p>Create a page and capture this moment.</p>
          <button class="new-note-button compact" id="emptyNewNote" type="button">＋ New note</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="note-store.js"></script>
    <script src="app.js"></script>
  <script src="/language-switch.js"></script>
</body>
</html>
