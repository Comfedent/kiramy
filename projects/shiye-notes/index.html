<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>拾页 · 轻量笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="portfolio-back" href="../../" aria-label="返回作品集">← 返回作品集</a>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="笔记列表">
        <header class="brand-row">
          <div>
            <p class="eyebrow">SHIYE NOTES</p>
            <h1>拾页<span class="brand-dot">。</span></h1>
          </div>
          <button class="icon-button mobile-close" id="closeSidebar" aria-label="关闭笔记列表">×</button>
        </header>

        <button class="new-note-button" id="newNoteButton" type="button">
          <span aria-hidden="true">＋</span>
          新建笔记
          <kbd>N</kbd>
        </button>

        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" /></svg>
          <input id="searchInput" type="search" placeholder="搜索你的笔记…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="list-heading">
          <span>全部笔记</span>
          <span id="noteCount">0 篇</span>
        </div>
        <div class="notes-list" id="notesList" role="list"></div>

        <footer class="sidebar-footer">
          <span><i class="status-light"></i> 已保存至本机</span>
          <button class="text-button" id="clearAllButton" type="button">清空</button>
        </footer>
      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <section class="editor-pane" aria-label="笔记编辑器">
        <header class="editor-toolbar">
          <button class="icon-button menu-button" id="openSidebar" aria-label="打开笔记列表">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="crumb">
            <span>我的笔记</span>
            <span>/</span>
            <strong id="crumbTitle">无标题笔记</strong>
          </div>
          <div class="toolbar-actions">
            <span class="save-state" id="saveState">已保存</span>
            <button class="icon-button" id="pinButton" aria-label="置顶笔记" title="置顶笔记">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9 3v5l-3 4v2h12v-2l-3-4V3M12 14v7" /></svg>
            </button>
            <button class="icon-button danger" id="deleteButton" aria-label="删除笔记" title="删除笔记">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" /></svg>
            </button>
          </div>
        </header>

        <div class="paper" id="editorArea">
          <div class="paper-meta">
            <span id="updatedAt">今天</span>
            <span class="meta-rule"></span>
            <span id="readingTime">少于 1 分钟阅读</span>
          </div>
          <input class="title-input" id="titleInput" aria-label="笔记标题" placeholder="无标题笔记" maxlength="120" />
          <textarea class="content-input" id="contentInput" aria-label="笔记内容" placeholder="从这里开始记录…"></textarea>
        </div>

        <footer class="editor-footer">
          <div class="writing-hint"><span>✦</span> 灵感不必完整，先写下来。</div>
          <div><span id="wordCount">0 字</span><span class="separator">·</span><span id="charCount">0 字符</span></div>
        </footer>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-mark">页</div>
          <h2>还没有笔记</h2>
          <p>新建一页，记下此刻。</p>
          <button class="new-note-button compact" id="emptyNewNote" type="button">＋ 新建笔记</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="note-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
