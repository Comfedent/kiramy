<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f1e8">
    <title>拾页 · 私人笔记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  <link rel="alternate" hreflang="en" href="https://www.kira-malaysia.com/projects/shiye-notes/">
<link rel="alternate" hreflang="zh-Hans" href="https://www.kira-malaysia.com/zh/projects/shiye-notes/">
<link rel="alternate" hreflang="x-default" href="https://www.kira-malaysia.com/projects/shiye-notes/">
</head>
  <body>
    <a class="portfolio-back" href="../../" aria-label="返回投资组合">← 返回作品集</a>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="注释列表">
        <header class="brand-row">
          <div>
            <p class="eyebrow">十野笔记</p>
            <h1>拾页<span class="brand-dot">。</span></h1>
          </div>
          <button class="icon-button mobile-close" id="closeSidebar" aria-label="关闭笔记列表">×</button>
        </header>

        <button class="new-note-button" id="newNoteButton" type="button">
          <span aria-hidden="true">＋</span>
          新笔记
          <kbd>氮</kbd>
        </button>

        <label class="search-box" for="searchInput">
          <svg viewbox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索你的笔记..." autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>

        <div class="list-heading">
          <span>所有笔记</span>
          <span id="noteCount">0 条笔记</span>
        </div>
        <div class="notes-list" id="notesList" role="list"></div>

        <footer class="sidebar-footer">
          <span><i class="status-light"></i> 已保存在此设备上</span>
          <button class="text-button" id="clearAllButton" type="button">清除</button>
        </footer>
      </aside>

      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <section class="editor-pane" aria-label="笔记编辑器">
        <header class="editor-toolbar">
          <button class="icon-button menu-button" id="openSidebar" aria-label="打开笔记列表">
            <svg viewbox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          </button>
          <div class="crumb">
            <span>我的笔记</span>
            <span>/</span>
            <strong id="crumbTitle">无标题笔记</strong>
          </div>
          <div class="toolbar-actions">
            <span class="save-state" id="saveState">已保存</span>
            <button class="icon-button" id="pinButton" aria-label="引脚注释" title="引脚注释">
              <svg viewbox="0 0 24 24" aria-hidden="true"><path d="M8 3h8M9 3v5l-3 4v2h12v-2l-3-4V3M12 14v7"></path></svg>
            </button>
            <button class="icon-button danger" id="deleteButton" aria-label="删除注释" title="删除注释">
              <svg viewbox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"></path></svg>
            </button>
          </div>
        </header>

        <div class="paper" id="editorArea">
          <div class="paper-meta">
            <span id="updatedAt">今天</span>
            <span class="meta-rule"></span>
            <span id="readingTime">阅读时间不到 1 分钟</span>
          </div>
          <input class="title-input" id="titleInput" aria-label="注释标题" placeholder="无标题笔记" maxlength="120">
          <textarea class="content-input" id="contentInput" aria-label="备注内容" placeholder="从这里开始写..."></textarea>
        </div>

        <footer class="editor-footer">
          <div class="writing-hint"><span>✦</span> 想法不需要是完整的。首先把它们写下来。</div>
          <div><span id="wordCount">0 字</span><span class="separator">·</span><span id="charCount">0 个字符</span></div>
        </footer>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-mark">页</div>
          <h2>还没有笔记</h2>
          <p>创建一个页面并捕捉这一刻。</p>
          <button class="new-note-button compact" id="emptyNewNote" type="button">＋ 新笔记</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="note-store.js"></script>
    <script src="app.js"></script>
  <script src="/language-switch.js"></script>
</body>
</html>
